name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all offline suites (no credentials)
        run: python3 lab.py test
      - name: Check recorded demo evidence
        run: |
          python3 lab.py repair --verify-run recursive-redteam/demo/recordings/nemotron-self-debug-20261017 --json > /tmp/repair-check.json
          python3 -c 'import json; r=json.load(open("/tmp/repair-check.json")); assert r["source_hashes_valid"] and r["hosted_model_calls"] == 0; assert r["verified"] is False; assert r["after"]["passed"] == 15 and r["after"]["total"] == 22'
